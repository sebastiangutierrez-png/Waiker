<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Waikao · LIA, el agente de Agromyss</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap"
    rel="stylesheet" />

  <link rel="stylesheet" href="css/styles.css" />
</head>

<body>
  <a class="salto" href="#wk-chat-input">Saltar al chat</a>

  <div class="app" id="app">

    <!-- ══════════ barra lateral ══════════ -->
    <aside class="lateral" id="lateral">
      <div class="marca">
        <div class="marca-usuario" id="wk-lia-usuario"></div>
        <button class="tema-btn" type="button" data-accion="tema" id="wk-tema-btn" aria-label="Cambiar tema"></button>
        <button class="lateral-cerrar" type="button" data-accion="cerrar-menu" aria-label="Cerrar menú">×</button>
      </div>

      <div class="lia-tarjeta" id="wk-lia-tarjeta"></div>

      <nav class="lia-nav" id="wk-lia-nav" aria-label="Vistas de LIA"></nav>

      <div class="lia-recientes" id="wk-lia-recientes"></div>

      <div class="lia-pulso" id="wk-lia-pulso"></div>
    </aside>

    <div class="lateral-fondo" data-accion="cerrar-menu" hidden></div>

    <!-- ══════════ contenido ══════════ -->
    <main class="principal-lia">

      <header class="cabecera-lia">
        <button class="menu-btn" type="button" data-accion="abrir-menu" aria-label="Abrir menú">☰</button>
        <span class="cabecera-lia-finca" id="wk-finca-movil"></span>
      </header>

      <div class="aviso" id="wk-aviso" role="status"></div>

      <section class="vista-chat" id="wk-vista-chat">
        <div class="chat-cima" id="wk-chat-cima"></div>
        <div class="chat-datos" id="wk-chat-datos" hidden></div>
        <div class="chat-hilo" id="wk-chat-hilo" aria-live="polite"></div>
      </section>

      <section class="vista-historial" id="wk-vista-historial" hidden></section>

      <div class="chat-pie" id="wk-chat-pie">
        <div class="chat-atajos" id="wk-chat-atajos"></div>
        <form class="chat-form" id="wk-chat-form" autocomplete="off">
          <label class="oculto" for="wk-chat-input">Pregunta para LIA</label>
          <div class="chat-form-fila">
            <span class="chat-form-marca">
              <span class="chat-form-ia">IA</span>
              <span class="chat-form-marca-texto"><b>LIA</b><i>agente de IA</i></span>
            </span>
            <input id="wk-chat-input" placeholder="Pregúntale a LIA: «¿riego hoy Vega Baja?»" />
            <button class="btn" type="submit" id="wk-chat-enviar">Preguntar</button>
          </div>
          <p class="chat-form-nota">Respuestas generadas por IA a partir de sensores, clima y registros de la finca. Puede equivocarse — revisa lo importante antes de mandar la cuadrilla.</p>
        </form>
      </div>
    </main>

    <!-- ══════════ propuestas ══════════ -->
    <aside class="drawer" id="wk-drawer"></aside>

  </div>

  <script type="module" src="js/main.js"></script>
</body>

</html>
