<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agromyss | Asistente LIA</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap"
    rel="stylesheet" />

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css" />
  <link rel="stylesheet" href="css/styles.css?v=3" />
  <script type="module" src="js/agente.js"></script>
</head>

<body class="pagina-agente">
  <div class="grain"></div>

  <div class="concept-shell" style="grid-template-columns:232px 1fr">
    <aside class="csb">
      <div class="csb-logo">
        <img class="csb-logo-img" src="assets/logoAgromyss.png" alt="Agromyss" />
      </div>

      <nav class="csb-nav">
        <a href="index.html"><i class="ph ph-squares-four csb-nav-icon"></i>Resumen</a>
        <a href="index.html#lotes"><i class="ph ph-map-trifold csb-nav-icon"></i>Lotes</a>
        <a href="index.html#clima"><i class="ph ph-cloud-sun csb-nav-icon"></i>Clima</a>
        <a href="index.html#sensores"><i class="ph ph-thermometer-simple csb-nav-icon"></i>Sensores</a>
        <a href="index.html#tareas"><i class="ph ph-check-square csb-nav-icon"></i>Tareas</a>
        <a href="index.html#reportes"><i class="ph ph-flask csb-nav-icon"></i>Laboratorio</a>
        <a href="index.html#insumos"><i class="ph ph-package csb-nav-icon"></i>Insumos</a>

        <div class="csb-nav-titulo">Agente</div>
        <a href="index.html#propuestas"><i class="ph ph-lightbulb csb-nav-icon"></i>Propuestas</a>
        <a href="agente.html" class="active"><i class="ph ph-chat-circle-dots csb-nav-icon"></i>Asistente</a>

        <div class="csb-nav-titulo">Sistema</div>
        <a href="index.html#config"><i class="ph ph-gear csb-nav-icon"></i>Configuración</a>
      </nav>
    </aside>

    <main class="csb-main" style="padding-top:26px">
      <div class="aviso" id="wk-aviso" role="status"></div>

      <section class="vista-chat" id="wk-vista-chat">
        <div class="chat-cima" id="wk-chat-cima"></div>
        <div class="chat-datos" id="wk-chat-datos" hidden></div>
        <div class="chat-hilo" id="wk-chat-hilo" aria-live="polite"></div>
      </section>

      <div class="chat-pie" id="wk-chat-pie">
        <div class="chat-atajos" id="wk-chat-atajos"></div>
        <form class="chat-form" id="wk-chat-form" autocomplete="off">
          <label class="oculto" for="wk-chat-input">Pregunta para LIA</label>
          <div class="chat-form-fila">
            <span class="chat-form-marca">
              <span class="chat-form-ia">IA</span>
            </span>
            <input id="wk-chat-input" placeholder="Pregúntale a LIA: «¿riego hoy Vega Baja?»" />
            <button class="va-enviar" type="submit" id="wk-chat-enviar">Preguntar</button>
          </div>
          <p class="chat-form-nota">Respuestas generadas por IA a partir de sensores, clima y registros de la finca. Puede equivocarse — revisa lo importante antes de mandar la cuadrilla.</p>
        </form>
      </div>
    </main>
  </div>
</body>

</html>
